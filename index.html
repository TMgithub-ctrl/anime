<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anime">
<title>Meine Anime-Listen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1024;--panel:#181c3a;--line:#2b3160;--text:#eef0fb;--muted:#8d93bd;--accent:#ffb347;--danger:#ff6b81;--ok:#6ee7a8;--r:16px;--g1:#2a2470;--g2:#4a1d5c}
[data-theme=sakura]{--bg:#1a0f1c;--panel:#2b1a30;--line:#4a2a52;--accent:#ff7eb6;--g1:#5a1f4a;--g2:#2e1a5c}
[data-theme=mint]{--bg:#0a1a1c;--panel:#12292c;--line:#1f4a4c;--accent:#5eead4;--g1:#0f4a4a;--g2:#1c3a5c}
[data-theme=ozean]{--bg:#0a1120;--panel:#13203a;--line:#22365e;--accent:#60a5fa;--muted:#8fa3c8;--g1:#0f2f5c;--g2:#1a1f5c}
[data-theme=lavendel]{--bg:#120e22;--panel:#1f193b;--line:#372b63;--accent:#c4a1ff;--muted:#9c93c4;--g1:#3a2470;--g2:#1d2a5c}
[data-theme=feuer]{--bg:#190d0b;--panel:#2a1814;--line:#4b2a22;--accent:#ff8a5c;--muted:#bd978d;--g1:#5c1f14;--g2:#4a1d3a}
[data-theme=limette]{--bg:#0d1509;--panel:#192513;--line:#2d4321;--accent:#a3e635;--muted:#9bb08d;--g1:#26450f;--g2:#0f3a2e}
[data-theme=gold]{--bg:#13100a;--panel:#231e12;--line:#41381f;--accent:#facc15;--muted:#b5a882;--g1:#4a3a0f;--g2:#3a1d1d}
[data-theme=nacht]{--bg:#0b0c0f;--panel:#16181e;--line:#2a2e38;--accent:#e2e8f0;--muted:#8b919e;--g1:#22252e;--g2:#1a1c24}
[data-theme=kirsche]{--bg:#170a10;--panel:#28121c;--line:#4a2133;--accent:#fb7185;--muted:#c0909f;--g1:#5c1430;--g2:#2e1a4a}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:16px/1.5 "Outfit","Trebuchet MS",system-ui,sans-serif;padding:32px 18px 80px;
  background:radial-gradient(900px 420px at 80% -10%,var(--g1) 0%,transparent 70%),radial-gradient(700px 400px at -10% 10%,var(--g2) 0%,transparent 65%),var(--bg);background-attachment:fixed}
main{max-width:1060px;margin:0 auto}
header{margin-bottom:18px}
:root{color-scheme:dark}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(90deg,#fff,var(--accent) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{color:var(--muted);margin:6px 0 0}
.sync{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:8px}
.sync.ok{color:var(--ok)}.sync.ok::before{background:var(--ok)}
.sync.bad{color:var(--danger)}.sync.bad::before{background:var(--danger)}
.themes{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}



.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{font:inherit;font-size:.95rem;color:var(--muted);background:rgba(24,28,58,.7);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.tab i{font-style:normal;color:var(--ok);margin-left:6px}
.tab:hover{color:var(--text)}
.tab.on{color:#2a1c00;background:var(--accent);border-color:var(--accent);font-weight:600}
.tab.on i{color:#2a1c00}
.tab.add{border-style:dashed}

.search{position:relative;margin-bottom:6px}
.search svg{position:absolute;left:16px;top:16px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{width:100%;padding:15px 18px 15px 46px;font:inherit;color:var(--text);background:rgba(24,28,58,.8);backdrop-filter:blur(8px);border:2px solid var(--line);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 18%,transparent)}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 14px 18px;min-height:1.3em}
.sug{position:absolute;left:0;right:0;top:58px;z-index:10;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sug button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:8px 14px;cursor:pointer}
.sug button:hover,.sug button:focus{background:var(--line);outline:none}
.sug img{width:40px;height:58px;object-fit:cover;border-radius:6px;background:var(--line)}
.sug small{color:var(--muted)}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px;align-items:center}
.bar button,.panel button{font:inherit;font-size:.9rem;color:var(--text);background:rgba(24,28,58,.8);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.bar button:hover,.panel button:hover{border-color:var(--accent)}
.bar .pri,.panel .go{background:var(--accent);color:#2a1c00;border-color:var(--accent);font-weight:600}
.panel{background:rgba(24,28,58,.9);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 24px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.panel p.warn{margin:12px 0 0;font-size:.82rem}
.panel textarea,.panel input[type=text]{width:100%;font:inherit;font-size:.9rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.panel textarea{resize:vertical}
.panel label{display:block;color:var(--muted);font-size:.85rem;margin:0 0 12px}
.panel label input{margin-top:4px}
.panel .chk{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.82rem;margin:10px 0}
.panel .chk input{width:auto;margin:3px 0 0}
.panel h4{margin:20px 0 6px;font-size:.95rem;color:var(--text)}
.panel input[type=password]{width:100%;font:inherit;font-size:.9rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
.panel .prow .ppw{width:150px;margin:0;padding:6px 10px}
.panel .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px}
.panel .prow .pn{flex:1;min-width:120px;font-weight:600;color:var(--text)}
.panel .prow .pn small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.panel .prow button{padding:5px 14px}
.panel .dng:hover{border-color:#ff6b6b;color:#ff9a9a}
.panel .row2{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.panel input[type=file]{color:var(--muted);font-size:.85rem;max-width:100%}
.panel ol{margin:0 0 12px 18px;padding:0;color:var(--muted);font-size:.9rem}
.panel summary{cursor:pointer;color:var(--text);margin-top:14px}
.panel pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.8rem;color:var(--muted);margin:10px 0 0}
.panel .msg{margin-top:10px;font-size:.88rem;color:var(--muted);word-break:break-word}
.panel .msg.bad{color:var(--danger)}
.panel .msg:empty{display:none}

.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .seg button{border:0;border-radius:0;background:var(--panel);color:var(--muted);padding:7px 18px}
.bar .seg button.on{background:var(--accent);color:#2a1c00;font-weight:600}

.hero{position:relative;display:flex;gap:28px;align-items:center;padding:26px;border-radius:24px;overflow:hidden;margin-bottom:34px;border:1px solid var(--line);isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30px;background:var(--art) center/cover;filter:blur(36px) saturate(1.3);opacity:.55;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 35%,transparent));z-index:-1}
.hero .poster{flex:0 0 190px;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);background:var(--line);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--muted)}
.hero .poster img{width:100%;height:100%;object-fit:cover;display:block}
.hero .txt{flex:1;min-width:230px}
.flag{display:inline-block;background:var(--accent);color:#2a1c00;font-weight:600;font-size:.85rem;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.hero h2{font-size:clamp(1.5rem,4vw,2.4rem);line-height:1.15;margin:0 0 16px;font-weight:800}
.hero .tools{justify-content:flex-start;gap:18px;margin-top:10px}
.hero input[type=range]{max-width:340px}
.hero .scs{margin-bottom:14px}

h3{font-size:1.1rem;font-weight:600;color:var(--muted);margin:36px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.card{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.5)}
.card .poster{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:var(--muted);background:var(--line)}
.card .poster img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;top:10px;left:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);font-weight:800;border-radius:999px;padding:1px 11px;font-size:.95rem}
.rank.r2{background:#c9d1e8;color:#14172e}
.rank.r3{background:#d9a066;color:#2a1700}
.badge{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;background:hsl(var(--h) 85% 58%);color:#14102a;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.badge.none{background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--muted)}
.info{position:absolute;left:0;right:0;bottom:0;padding:44px 12px 10px;background:linear-gradient(to top,color-mix(in srgb,var(--bg) 97%,transparent) 35%,transparent)}
.title{font-weight:600;font-size:.95rem;line-height:1.25;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oth{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.oth b{color:hsl(var(--h) 85% 66%)}
.slw{max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .2s}
.card:hover .slw,.card:focus-within .slw{max-height:150px;opacity:1}
@media (hover:none){.slw{max-height:150px;opacity:1}}
.tools{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.tools .mv{color:var(--text)}
.mylnk{display:inline-flex;align-items:center;font:inherit;font-size:.8rem;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--text);text-decoration:none;white-space:nowrap;line-height:1.4}
.mylnk:hover{background:var(--accent);color:#2a1c00}
.sform{display:flex;flex-direction:column;gap:8px}
.sform label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.sform input{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;box-sizing:border-box}
.side .sform button{justify-content:center;text-align:center;padding:9px 14px}
.side .sform p{overflow-wrap:anywhere}
.lnname{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 8px;font-size:.82rem;color:var(--muted)}
.lnname input{font:inherit;width:min(18em,60vw);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-left:6px}
.lnname button{font:inherit;font-size:.82rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.lnname small{width:100%}
.mylinkp{margin:4px 0 6px}
.mylink{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0 8px;font-size:.85rem;color:var(--muted)}
.mylink input{font:inherit;width:min(26em,70vw);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-left:6px}
.mylink button{font:inherit;font-size:.85rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.mylink small{width:100%;word-break:break-all}
.nexts{margin:2px 0 6px}.nexts button{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}.nexts button:hover{color:var(--text);border-color:var(--accent)}
.seas{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
.seas span{font-size:.72rem;color:var(--muted);margin-right:2px}
.seas button{font:inherit;font-size:.72rem;font-weight:700;color:var(--text);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:1px 9px;min-height:0;cursor:pointer}
.seas button.on{background:var(--accent);border-color:var(--accent);color:#2a1c00}
.oprog{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.hero .ctl{margin:8px 0 4px}
.chip.mal{border-color:#4a6fc7;color:#aabdf0}.chip.mal b{color:#cdd8ff;font-size:1rem}
.d.up{color:#7be0a4;font-style:normal;font-weight:700}.d.dn{color:#ff9a9a;font-style:normal;font-weight:700}
.malbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.malbar button{font:inherit;font-size:.85rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.malbar button.on{color:var(--text);border-color:var(--accent)}
.omdb{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.omdb input{font:inherit;width:9.5em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.omdb button{font:inherit;font-size:.85rem;color:var(--text);background:var(--panel);border:1px solid var(--accent);border-radius:999px;padding:4px 12px;cursor:pointer}
.omdb small{width:100%}
.srcst{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 8px;font-size:.82rem;color:var(--muted)}
.srcst b{color:var(--text)}
.chip.mal.imdb{border-color:#c9a227;color:#e8d38a}.chip.mal.imdb b{color:#ffe7a0}
.maltest{font:inherit;font-size:.8rem;color:var(--muted);white-space:pre-wrap;margin:0 0 8px}
.malbar small{color:var(--muted)}
.malsum{display:flex;gap:6px 18px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.malsum b{color:var(--text)}.malsum b.d.up{color:#7be0a4}.malsum b.d.dn{color:#ff9a9a}
.strm{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:.8rem;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--sc);color:var(--sf);text-decoration:none;white-space:nowrap;line-height:1.4}
.strm:hover{filter:brightness(1.12)}
.hero p .strm{font-size:.9rem;padding:5px 14px}
.tools button{background:none;border:0;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;padding:2px 0}
.tools button:hover{color:var(--text)}
.tools .del:hover,.tools .del[data-arm]{color:var(--danger)}

.srow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.sctl{flex:1;min-width:200px}
.ring{--p:calc(var(--s) * 10%);position:relative;flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(hsl(var(--h) 85% 60%) var(--p),rgba(255,255,255,.14) 0)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring output{position:relative;font-size:2.5rem;font-weight:800;line-height:1;color:hsl(var(--h) 85% 66%)}
.ring.sm{width:70px;height:70px}.ring.sm::before{inset:6px}.ring.sm output{font-size:1.25rem}

.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctl .lab{color:var(--muted);font-size:.85rem}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{font:inherit;font-size:.9rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.who button.on{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctl .seg button{font:inherit;font-size:.9rem;color:var(--muted);background:var(--panel);border:0;padding:7px 18px;cursor:pointer}
.ctl .seg button.on{background:var(--accent);color:#2a1c00;font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin:6px 0 26px}
.rows{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel);border-radius:var(--r);padding:10px 16px 10px 12px}
.row .rk{font-weight:800;font-size:1.2rem;color:var(--muted);min-width:2.4ch}
.row .pst{width:54px;height:78px;border-radius:8px;overflow:hidden;background:var(--line);flex:none}
.row .pst img{width:100%;height:100%;object-fit:cover;display:block}
.row .mid{flex:1;min-width:190px}
.row .nm{font-weight:600;margin-bottom:4px}
.scs{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:1px 11px;font-size:.85rem;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip b{color:hsl(var(--h) 85% 66%);font-size:1rem}
.row input[type=range]{max-width:200px;margin-top:6px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.18);cursor:pointer;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.empty{color:var(--muted);text-align:center;padding:70px 0}.empty b{display:block;color:var(--text);font-size:1.5rem;font-weight:800;margin-bottom:4px}
.cats{display:flex;margin:0 0 18px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);width:100%;max-width:560px}
.cats button{flex:1;font:inherit;font-size:1rem;font-weight:600;color:var(--muted);background:none;border:0;padding:10px 12px;cursor:pointer;white-space:nowrap}
.cats button small{font-weight:400;opacity:.85;margin-left:6px}
.cats button.on{background:var(--accent);color:#2a1c00}
.cats button:hover:not(.on){color:var(--text)}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pg{display:flex;gap:12px;align-items:center;margin:2px 0 8px;font-size:.88rem;color:var(--muted)}
.pg .pbar{flex:1;max-width:260px}
.minilab{display:block;color:var(--muted);font-size:.8rem;margin-top:6px}
.wact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wact button,.dback button,.step button,.lnk{font:inherit;font-size:.85rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.wact button:hover,.dback button:hover,.step button:hover,.lnk:hover{border-color:var(--accent)}
.wact .pri{background:var(--accent);color:#2a1c00;border-color:var(--accent);font-weight:600}
.dback{margin-bottom:14px}
.lnk{margin-top:12px}
.hero .seg{display:inline-flex;margin:0 0 14px}
.hero .seg button{font:inherit;font-size:.9rem;color:var(--muted);background:var(--panel);border:0;border-radius:0;padding:7px 18px;cursor:pointer}

  mask:linear-gradient(#000 0 50%,transparent 50%),repeating-linear-gradient(#000 0 14px,transparent 14px 20px);mask-composite:add;-webkit-mask-composite:source-over}

/* Kompakte Theme-Auswahl: drei Gruppen, beim Überfahren/Antippen aufklappen */
.themes{position:relative;gap:12px}
.tgrp{position:relative}
.tgrp>.tg{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--c);cursor:pointer;padding:0;display:block}
.tgrp.cur>.tg{outline:2px solid var(--text);outline-offset:2px}
.tpop{display:none;position:absolute;left:-8px;top:100%;padding-top:8px;z-index:45}
.tpop>div{display:grid;grid-template-columns:repeat(2,minmax(120px,auto));width:max-content;max-width:calc(100vw - 24px);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.tpop h4{grid-column:1/-1;margin:2px 4px 4px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (hover:hover){.tgrp:hover .tpop{display:block}}
@media (max-width:620px){header{position:relative;z-index:25}.themes{position:static}.tgrp{position:static}.tpop{left:0;right:0}.tpop>div{width:auto;max-width:none;grid-template-columns:repeat(2,minmax(0,1fr))}.tpop button{white-space:normal;line-height:1.25}}

function renderCompare(L) {

  if (st === 'w' && !epOf(L, me, a)) setEp(L, aid, 1);
  if (st === 'd' && x.n) setEp(L, aid, x.n);
  touch(L);
}

/* Ein gemeinsamer Konten-Speicher (wie eine Liste) enthält pro Konto: Name, Prüfwert des Passworts, Personen-Kennung, Listen-Codes. */
const acctKey = n => String(n || '').trim().toLowerCase();
const parseReg = t => { const m = String(t).match(/\b(jb|gs):([A-Za-z0-9._~+@-]{4,})/); return m ? m[1] + ':' + m[2] : null; };
let regCache = null, acctBusy = false;
async function regRead() {
  if (!db.reg) throw new Error('Kein Konten-Speicher verbunden.');
  const j = await bGet(db.reg); j.accts = j.accts || {}; return j;
}
async function regWrite(reg) { await bPut(db.reg, { v: 1, items: {}, scores: {}, reg: 1, accts: reg.accts }); regCache = reg; }
async function regCreate() {
  const errs = [];
  for (const k of Object.keys(BK)) {
    if (k === 'gs' && !gsDep()) continue;
    try { const key = await bCreate(k, { v: 1, items: {}, scores: {}, reg: 1, accts: {} }); await bGet(key); db.reg = key; save(); return key; }
    catch (e) { errs.push(e.message); }
  }
  throw new Error(errs.join(' | ') + (gsDep() ? '' : ' | Tipp: Richte unter „Online-Sync“ den eigenen Google-Speicher ein.'));
}
const listRec = l => ({ key: l.key, name: l.name, type: typeOf(l), t: now() });
async function acctCreate(name, pw, pid, lists) {
  name = String(name || '').trim().slice(0, 30);
  if (name.length < 2) throw new Error('Der Name braucht mindestens 2 Zeichen.');
  if (String(pw || '').length < 4) throw new Error('Das Passwort braucht mindestens 4 Zeichen.');
  const reg = await regRead(), k = acctKey(name);
  if (reg.accts[k] && !reg.accts[k].d) throw new Error('Diesen Konto-Namen gibt es schon.');
  if (pid && Object.values(reg.accts).some(a => !a.d && a.pid === pid)) throw new Error('Diese Person hat schon ein Konto.');
  reg.accts[k] = { name, pid: pid || 'p' + uid(), pw: await newPw(pw), ts: now(), lists: (lists || []).filter(l => l.key).map(listRec) };
  await regWrite(reg);
}
async function acctLogin(name, pw) {
  const reg = await regRead(), a = reg.accts[acctKey(name)];
  if (!a || a.d) { await wait(600); throw new Error('Konto nicht gefunden.'); }
  if (!(await okPw(a.pw, pw))) { await wait(600); throw new Error('Falsches Passwort.'); }
  regCache = reg; return a;
}
async function applyAcct(a, merge) {
  takeIdentity(a.pid, a.name, merge);
  db.me.id = a.pid; db.me.name = a.name;
  for (const L of db.lists) { const e = L.scores[db.me.id]; if (e) { e.n = a.name; e.nt = now(); } }
  db.acct = { name: a.name }; save();
  for (const l of a.lists || []) if (!l.d && !db.lists.some(x => x.key === l.key)) { try { await joinCode(l.key, a.name); } catch (e) {} }
  db.lists.filter(l => l.key).forEach((l, k) => queueSync(l, 300 + k * 400));
  save();
}
async function acctSync() {
  if (!db.acct || !db.reg || acctBusy) return;
  acctBusy = true;
  try {
    const reg = await regRead(), a = reg.accts[acctKey(db.acct.name)];
    if (!a || a.d || a.pid !== db.me.id) { if (!a || a.d) { db.acct = null; save(); render(); } return; }
    for (const l of a.lists || []) if (!l.d && !db.lists.some(x => x.key === l.key)) { try { await joinCode(l.key, a.name); } catch (e) {} }
    const have = new Map((a.lists || []).map(l => [l.key, l]));
    const add = db.lists.filter(l => l.key && !have.has(l.key));
    if (add.length) { a.lists = [...(a.lists || []), ...add.map(listRec)]; await regWrite(reg); }
    regCache = reg;
  } catch (e) {} finally { acctBusy = false; }
}

async function regLoad() { try { regCache = await regRead(); } catch (err) { regCache = { accts: {} }; setTimeout(() => amsg(err.message, true), 0); } renderScreen(); }
const clamp = v => { v = Math.round(+v); return v >= 1 ? Math.min(10, v) : 0; };
const listBy = lid => db.lists.find(l => l.lid === lid);
$('out').addEventListener('keydown', e => {

});
$('out').addEventListener('change', e => {
  const t = e.target, d = t.dataset.adm; if (!d || !screen) return;

    if (d === 'art') { adm.art = t.value; renderScreen(); return; }
    if (d === 'ek') { adm.k = Math.max(1, Math.floor(+t.value || 1)); renderScreen(); return; }
    if (d === 'lname') { const l = listBy(t.dataset.lid), n = t.value.trim().slice(0, 40); if (l && n) { l.name = n; l.nts = now(); touch(l); amsg('Name gespeichert.'); } return; }
    if (d === 'pname') { const e2 = L.scores[t.dataset.pid], n = t.value.trim().slice(0, 30); if (e2 && n) { e2.n = n; e2.nt = now(); touch(L); amsg('Name gespeichert.'); } return; }
    if (d === 'title') { const x = L.items[t.dataset.it], n = t.value.trim(); if (x && n) { L.items[t.dataset.it] = { ...x, t: n, ts: now() }; touch(L); amsg('Titel gespeichert.'); } return; }
    if (d === 'stat') { const sv = t.value; moveLegacy(L, t.dataset.it, sv); Object.keys(L.scores).forEach(pp => setRating(L, pp, 's:' + t.dataset.it, sv === 'w' ? 1 : sv === 'd' ? 2 : 0)); amsg('Status gespeichert (für alle Personen).'); return; }
    if (d === 'cell') { const v = adm.art === 'p' ? (clamp(t.value) ? 1 : 0) : clamp(t.value); setRating(L, t.dataset.pid, keyFor(adm.art, t.dataset.it, adm.k), v); t.value = v || ''; amsg('Gespeichert.'); return; }
    if (d === 'mine') { const l = listBy(t.dataset.lid); if (l) { setRating(l, db.me.id, keyFor(t.dataset.art, t.dataset.it, 0), clamp(t.value)); t.value = clamp(t.value) || ''; amsg('Gespeichert.'); } return; }
  } catch (err) { amsg(err.message, true); }
});
$('out').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.adm || !screen) return;
  const d = b.dataset.adm, L = listBy(adm.lid);
  const val = id => (($(id) || {}).value || '');
  const arm = (txt) => { if (!b.dataset.arm) { b.dataset.arm = 1; const o = b.textContent; b.textContent = 'Sicher?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = o; } }, 3000); return false; } return true; };
  try {
    if (d === 'close') { screen = null; render(); renderPanel(); return; }
    if (d === 'login') {
      const u = ($('aU').value || '').trim().toLowerCase(), pw = $('aP').value || '';
      const ok = u === ADM.u && pw && (await pwHash(pw, ADM.s)) === ADM.h;
      if (!ok) { await wait(700); amsg('Name oder Passwort falsch.', true); return; }
      adminOn = true; render(); return;
    }
    if (d === 'toppl') { screen = null; panel = 'ppl'; render(); renderPanel(); return; }
    if (d === 'alogin') {
      const nm = val('cN'), pw = val('cP'), prev = db.reg;
      if (!db.reg) { const k = parseReg(val('cRg')); if (!k) { amsg('Bitte den Konten-Code vom Admin einfügen.', true); return; } db.reg = k; }
      amsg('Melde an …');
      let a; try { a = await acctLogin(nm, pw); } catch (err) { db.reg = prev; throw err; }
      await applyAcct(a, !!($('cMerge') && $('cMerge').checked));
      render(); amsg(`Angemeldet als ${a.name}.`); return;
    }
    if (d === 'alogout') { db.acct = null; save(); render(); amsg('Abgemeldet. Deine Daten bleiben auf diesem Gerät.'); return; }
    if (d === 'async') { amsg('Gleiche ab …'); await acctSync(); render(); amsg('Abgeglichen.'); return; }
    if (d === 'apw') {
      const o = val('cOld'), n = val('cNew'); if (n.length < 4) { amsg('Das neue Passwort braucht mindestens 4 Zeichen.', true); return; }
      const reg = await regRead(), a = reg.accts[acctKey(db.acct && db.acct.name)];
      if (!a || !(await okPw(a.pw, o))) { amsg('Das alte Passwort stimmt nicht.', true); return; }
      a.pw = await newPw(n); a.ts = now(); await regWrite(reg); render(); amsg('Passwort geändert.'); return;
    }
    if (!adminOn) return;
    if (d === 'tab') { adm.tab = b.dataset.tab; renderScreen(); if (adm.tab === 'accts' && db.reg && !regCache) regLoad(); return; }
    if (d === 'regcreate') { amsg('Lege Konten-Speicher an …'); await regCreate(); regCache = await regRead(); renderScreen(); amsg('Konten-Speicher angelegt. Kopiere den Code.'); return; }
    if (d === 'regjoin') { const k = parseReg(val('aRegIn')); if (!k) { amsg('Das ist kein gültiger Konten-Code.', true); return; } const prev = db.reg; db.reg = k; try { regCache = await regRead(); } catch (err) { db.reg = prev; throw err; } save(); renderScreen(); amsg('Verbunden.'); return; }
    if (d === 'regcopy') { const t = $('aRegOut'); try { await navigator.clipboard.writeText(t.value); amsg('Konten-Code kopiert.'); } catch (err) { t.select(); amsg('Bitte den markierten Code kopieren.'); } return; }
    if (d === 'regload') { await regLoad(); return; }
    if (d === 'acreate') {
      const picks = [...$('out').querySelectorAll('[data-adm=alchk]:checked')].map(x => db.lists.find(l => l.key === x.value)).filter(Boolean);
      await acctCreate(val('aAcN'), val('aAcP'), null, picks); renderScreen(); amsg('Konto angelegt.'); return;
    }
    if (d === 'pacc') {
      const e2 = L.scores[b.dataset.pid] || {}, nm = b.dataset.pid === db.me.id ? db.me.name : e2.n;
      if (!nm) { amsg('Die Person braucht einen Namen.', true); return; }
      const f = [...$('out').querySelectorAll('[data-adm=pwin]')].find(x => x.dataset.pid === b.dataset.pid);
      await acctCreate(nm, f ? f.value : '', b.dataset.pid, L.key ? [L] : []); amsg(`Konto „${nm}“ angelegt.`); return;
    }
    if (d === 'apwset') {
      const f = [...$('out').querySelectorAll('[data-adm=apwin]')].find(x => x.dataset.ak === b.dataset.ak), v = f ? f.value : '';
      if (v.length < 4) { amsg('Das Passwort braucht mindestens 4 Zeichen.', true); return; }
      const reg = await regRead(), a = reg.accts[b.dataset.ak]; if (!a) return;
      a.pw = await newPw(v); a.ts = now(); await regWrite(reg); renderScreen(); amsg('Passwort gesetzt.'); return;
    }
    if (d === 'aadd') {
      const sel = b.closest('.arow').querySelector('select'), l = db.lists.find(x => x.key === (sel && sel.value));
      const reg = await regRead(), a = reg.accts[b.dataset.ak]; if (!a || !l) return;
      a.lists = (a.lists || []).filter(x => x.key !== l.key).concat(listRec(l)); await regWrite(reg); renderScreen(); amsg('Liste zugeordnet.'); return;
    }
    if (d === 'adel') {
      if (!arm()) return;
      const reg = await regRead(), a = reg.accts[b.dataset.ak]; if (!a) return;
      reg.accts[b.dataset.ak] = { name: a.name, pid: a.pid, d: now(), ts: now(), lists: [] }; await regWrite(reg); renderScreen(); amsg('Konto gelöscht.'); return;
    }
    if (d === 'open') { db.active = b.dataset.lid; { const l0 = listBy(db.active); if (l0) db.mode = typeOf(l0); } screen = null; detail = null; save(); render(); renderPanel(); return; }
    if (d === 'addcode') { screen = null; panel = 'imp'; render(); renderPanel(); return; }
    if (d === 'ldel') {
      if (!arm()) return;
      db.lists = db.lists.filter(l => l.lid !== b.dataset.lid);
      if (!db.lists.length) db.lists.push(newList('Meine Liste'));
      if (!db.lists.some(l => l.lid === db.active)) db.active = db.lists[0].lid;
      save(); renderScreen(); amsg('Liste von diesem Gerät entfernt. Online-Daten bleiben bestehen.'); return;
    }
    if (d === 'copy') {
      const S = listBy(adm.src), D = listBy(adm.dst);
      if (!S || !D || S === D) { amsg('Wähle zwei verschiedene Listen.', true); return; }
      const picks = [...$('out').querySelectorAll('[data-adm=pick]:checked')].map(x => x.value);
      if (!picks.length) { amsg('Kreuze mindestens einen Eintrag an.', true); return; }
      const withR = $('cpR').checked; let n = 0, r = 0;
      for (const aid of picks) {
        const x = S.items[aid]; if (!x || x.d) continue;
        if (!(D.items[aid] && !D.items[aid].d)) { D.items[aid] = { ...x, ts: now() }; n++; }
        if (S.alts[aid] && !D.alts[aid]) D.alts[aid] = S.alts[aid];
        if (withR) for (const [pid, e2] of Object.entries(S.scores)) {
          for (const [k, v] of Object.entries(e2.s)) {
            if (!(k === aid || k === 'r:' + aid || k.startsWith(`e:${aid}#`)) || !(v[0] > 0)) continue;
            const t2 = D.scores[pid] || (D.scores[pid] = { n: e2.n || 'Person', s: {} });
            if (!t2.s[k] || !(t2.s[k][0] > 0)) { t2.s[k] = [v[0], now()]; r++; }
          }
        }
      }
      touch(D); renderScreen(); amsg(`${n} neue Einträge und ${r} Bewertungen nach „${D.name}“ übernommen.`); return;
    }
    if (d === 'pwset') {
      const f = [...$('out').querySelectorAll('[data-adm=pwin]')].find(x => x.dataset.pid === b.dataset.pid), v = f ? f.value : '';
      if (v.length < 4) { amsg('Das Passwort braucht mindestens 4 Zeichen.', true); return; }
      const e2 = L.scores[b.dataset.pid]; if (!e2) return;
      e2.pw = await newPw(v); touch(L); renderScreen(); amsg('Passwort gesetzt.'); return;
    }
    if (d === 'pwrst') { const e2 = L.scores[b.dataset.pid]; if (e2) { e2.pw = { t: now() }; touch(L); renderScreen(); amsg('Passwort gelöscht.'); } return; }
    if (d === 'prm') { if (!arm()) return; removePerson(L, b.dataset.pid); renderScreen(); amsg('Person entfernt.'); return; }
    if (d === 'padd') {
      const n = ($('aNew').value || '').trim().slice(0, 30); if (!n) { amsg('Bitte einen Namen eingeben.', true); return; }
      L.scores['p' + uid()] = { n, nt: now(), s: {} }; touch(L); renderScreen(); amsg('Person hinzugefügt.'); return;
    }
    if (d === 'iadd') {
      const n = ($('aItem').value || '').trim(); if (!n) { amsg('Bitte einen Titel eingeben.', true); return; }
      if (live(L).some(x => norm(x.t) === norm(n))) { amsg('Diesen Titel gibt es schon.', true); return; }
      L.items['m' + uid()] = { t: n, i: '', ts: now() }; touch(L); renderScreen(); amsg('Eintrag hinzugefügt.'); return;
    }
    if (d === 'idel') {
      if (!arm()) return;
      const x = L.items[b.dataset.it]; if (x) { L.items[b.dataset.it] = { ...x, d: 1, ts: now() }; touch(L); renderScreen(); amsg('Eintrag entfernt.'); } return;
    }
  } catch (err) { amsg(err.message, true); }
});

/* ---------- Import von Titeln ---------- */
const fixScore = v => {
  if (v == null || v === '') return null;
  let n = parseFloat(String(v).replace(',', '.'));
  if (!n) return null;
  if (n > 10) n = n / 10;
  return Math.min(10, Math.max(1, Math.round(n)));
};
function parseImport(text) {
  text = text.trim();
  if (!text) return [];
  if (/^[\[{]/.test(text)) {
    try {
      let d = JSON.parse(text);
      if (!Array.isArray(d)) d = d.list || d.animes || d.items || [];
      return d.map(x => typeof x === 'string' ? { title: x } : {
        title: x.title || x.t || x.name || x.anime || x.series_title, score: fixScore(x.score ?? x.rating ?? x.my_score),
        img: x.img || x.image, id: x.id }).filter(x => x.title);
    } catch (e) {}
  }
  return text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^(title|titel|name|anime)\s*[;,\t]/i.test(l)).map(l => {
    const m = l.match(/^(.*?)\s*[;\t|,]\s*(\d+(?:[.,]\d+)?)\s*$/);
    const clean = t => t.replace(/^(?:[-*•]|\d+[.)])\s+/, '').replace(/^"|"$/g, '').trim();
    return m ? { title: clean(m[1]), score: fixScore(m[2]) } : { title: clean(l) };
  }).filter(x => x.title);
}
let busy = false;
async function runImport(entries) {
  if (busy) return;
  busy = true;
  const L = cur();
  let added = 0, n = 0;
  for (const e of entries) {
    n++;
    hint(`Importiere ${n}/${entries.length}: ${e.title}`);
    if (live(L).some(x => norm(x.t) === norm(e.title))) continue;
    let aid, t = e.title, i = e.img || '', alts = [], eps = null, ex = {};
    if (e.img) aid = safeId(e.id != null ? e.id : 'i' + now() + n);
    else {
      let res = [];
      try { res = await search(e.title); } catch (err) {}
      const r = res[0] || { id: 'm' + now() + n, title: e.title, img: '' };
      aid = safeId(r.id); t = r.title; i = r.img; eps = r.episodes || null; ex = xf(r);
      alts = res.filter(x => x.id !== r.id).map(x => ({ t: x.title, i: x.img }));
      await new Promise(ok => setTimeout(ok, 700));
    }
    if (live(L).some(x => x.aid === aid)) continue;
    L.items[aid] = { t, i, ts: now(), ...(eps ? { n: eps } : {}), ...ex, ...(game() ? { by: db.me.id } : {}) }; L.alts[aid] = alts;
    if (e.score) setScore(L, aid, e.score); else touch(L);
    added++;
    if (cur() === L) safeRender();
  }
  busy = false;
  hint(`Import fertig: ${added} von ${entries.length} hinzugefügt.`);
}
