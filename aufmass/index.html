/* ---------------- Unterschreiben (Finger auf dem Display) ---------------- */
function openSignPad(title, sub, onDone) {
  openSheet(`<div class="head"><div class="grow"><div style="font-weight:700;font-size:17px">${esc(title)}</div><div class="muted small">${esc(sub || '')}</div></div><button class="x" id="spx">×</button></div>
    <div style="margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;position:relative;touch-action:none">
      <canvas id="spc" style="width:100%;height:200px;display:block;touch-action:none"></canvas>
      <div style="position:absolute;left:16px;right:16px;bottom:42px;border-bottom:1px solid #c8ccd2;pointer-events:none"></div>
      <div style="position:absolute;left:16px;bottom:16px;color:#8b939e;font-size:12px;pointer-events:none">Hier mit dem Finger unterschreiben</div></div>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="spclr">Löschen</button><button class="btn primary grow" id="spok">Übernehmen</button></div>
    <button class="btn block" id="spphoto" style="margin-top:10px">📷 Unterschrift vom Papier fotografieren</button>
    <input type="file" id="spfile" accept="image/*" style="display:none">`);
  const c = $('#spc'); const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = c.getBoundingClientRect(); c.width = Math.round(r.width * dpr); c.height = Math.round(200 * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#10204a';
  let drawing = false, last = null, empty = true;
  const pos = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top, t: e.timeStamp }; };
  c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); drawing = true; last = pos(e); g.beginPath(); g.arc(last.x, last.y, 1.2, 0, 7); g.fillStyle = '#10204a'; g.fill(); empty = false; });
  c.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p2 = pos(e);
    const v = Math.hypot(p2.x - last.x, p2.y - last.y) / Math.max(1, p2.t - last.t); g.lineWidth = Math.max(1.4, Math.min(3.2, 3.4 - v * 1.2));
    g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p2.x, p2.y); g.stroke(); last = p2; });
  const up = () => { drawing = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  $('#spx').onclick = closeSheet;
  $('#spphoto').onclick = () => $('#spfile').click();
  $('#spfile').onchange = async () => { const f = $('#spfile').files[0]; if (f) openPhotoSig(f, title, sub, onDone); };
  $('#spclr').onclick = () => { g.clearRect(0, 0, c.width, c.height); empty = true; };
  $('#spok').onclick = () => {
    if (empty) { toast('Bitte zuerst unterschreiben'); return; }
    // auf die gezeichnete Fläche zuschneiden
    const d = g.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) if (d[(y * c.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const pad = 6 * dpr; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width, x1 + pad); y1 = Math.min(c.height, y1 + pad);
    const o = document.createElement('canvas'); o.width = x1 - x0; o.height = y1 - y0; o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    onDone(o.toDataURL('image/png'));
  };
}

/* ---------------- Unterschrift vom Foto ----------------
   Papier-Unterschrift fotografieren -> Ausleuchtung ausgleichen (Schatten/Verläufe raus),
   Tinte freistellen (Hintergrund durchsichtig), einheitlich einfärben, Krümel/Ränder entfernen, zuschneiden. */
async function loadPhoto(file) {
  const url = URL.createObjectURL(file);
  try { return await loadImg(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}
function inkPrep(img) {
  const max = 1400, sc = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const W = Math.max(1, Math.round((img.naturalWidth || img.width) * sc)), H = Math.max(1, Math.round((img.naturalHeight || img.height) * sc));
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
/** Unterschrift + Datum (+ Name) zu einem Bild für die Excel zusammensetzen */

  const img = await loadImg(sig.img);
  const W = 800, H = 200, textH = 44; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const sc = Math.min((W - 20) / img.width, (H - textH - 8) / img.height);
  const w = img.width * sc, h = img.height * sc; g.drawImage(img, (W - w) / 2, 4 + (H - textH - 8 - h) / 2, w, h);
  g.fillStyle = '#10204a'; g.font = '600 30px -apple-system, Segoe UI, Roboto, Arial, sans-serif'; g.textAlign = 'center';
  g.fillText([fmtDateShort(sig.date), sig.name].filter(Boolean).join(' · '), W / 2, H - 10);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return { png: new Uint8Array(await blob.arrayBuffer()), w: W, h: H };
}
const fmtDateShort = iso => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';

}

async function renderSigs(m) { const o = {}; for (const k of ['erstellt', 'ag']) if (m[k]) o[k] = await composeSig(m[k]); return o; }

  $('#px').onclick = closeSheet;
  $('#sheet').querySelectorAll('.p').forEach(d => d.onclick = () => { closeSheet(); selectProject(d.dataset.id); });
  $('#pnew').onclick = () => { closeSheet(); renderSetup(); $('#tabs').classList.add('hidden'); };
}

/* ----- Backup ----- */
function bufToB64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBuf(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b.buffer; }
async function saveBackup() {
  const { template, lvPdf, ...rest } = S.p;
  const data = { app: 'aufmass', version: 1, saved: new Date().toISOString(), project: { ...rest, positions: rest.positions.map(({ _hay, _hayText, _words, _nospace, _posc, ...r }) => r), _use: undefined, _roomNorm: undefined, template: bufToB64(template), lvPdf: lvPdf ? bufToB64(lvPdf) : null }, entries: S.entries, notes: S.notes || [], nachweise: (S.nachweise || []).map(({ pdf, ...r }) => r), firma: await DB.get('kv', 'firma') };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const name = `Aufmass-Backup_${S.p.name.replace(/[^\wäöüÄÖÜß-]+/g, '_')}_${todayISO()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function restoreBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try {
      const data = JSON.parse(await inp.files[0].text());
      if (data.app !== 'aufmass') throw new Error('Keine Aufmaß-Backup-Datei');
      const p = { ...data.project, template: b64ToBuf(data.project.template), lvPdf: data.project.lvPdf ? b64ToBuf(data.project.lvPdf) : null };
      const exists = S.projects.find(x => x.id === p.id);
      if (exists && !confirm(`Baustelle „${p.name}“ gibt es schon. Mit dem Backup überschreiben?`)) return;
      if (exists) for (const e of await DB.byProject(p.id)) await DB.del('entries', e.id);
      await saveProject(p);
      for (const e of data.entries) await DB.put('entries', { ...e, projectId: p.id });
      for (const n of (data.notes || [])) await DB.put('notes', { ...n, projectId: p.id });
      for (const n of (data.nachweise || [])) await DB.put('nachweise', { ...n, projectId: p.id });
      if (data.firma && !(await DB.get('kv', 'firma'))) await DB.put('kv', data.firma, 'firma');
      Sync.dirty(p.id);
      await DB.put('kv', p.id, 'current'); await loadAll(); render(); toast(`Backup geladen: ${data.entries.length} Einträge`);
    } catch (err) { alert('Backup konnte nicht geladen werden: ' + (err.message || err)); }
  };
  inp.click();
}

      navigator.serviceWorker.register('sw.js').catch(() => {});
      // Bibliothek für Einlesen/Export in den Offline-Cache holen
      navigator.serviceWorker.ready.then(() => setTimeout(() => fetch('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', { mode: 'no-cors' }).catch(() => {}), 1500));
    }

  } catch (err) { $('#main').innerHTML = `<div class="card"><b class="neg">Start fehlgeschlagen</b><p>${esc(err.message || err)}</p></div>`; }
})();
