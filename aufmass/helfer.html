<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Helfer">
<meta name="theme-color" content="#14171c">
<title>Helfer-Aufmaß</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--panel2:#eef0f3;--text:#14171c;--muted:#5d6673;--line:#d9dde3;--accent:#1c7ed6;--accent-text:#fff;--ok:#2b8a3e;--warn:#c92a2a;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--panel:#181b21;--panel2:#20242c;--text:#eceef1;--muted:#9aa3af;--line:#2c313a;--accent:#4dabf7;--accent-text:#0f1115;--ok:#51cf66;--warn:#ff6b6b;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header b{display:block;font-size:17px}header small{color:var(--muted)}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow-wrap:anywhere}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 2px 8px}
label.f{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin:12px 2px 5px}
.i{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px 12px;font-size:17px}
.i:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.btn{min-height:46px;border-radius:11px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}.btn.block{display:block;width:100%}
.btn.danger{color:var(--warn)}.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:14.5px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px}.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.muted{color:var(--muted)}.small{font-size:13.5px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it .q{font-weight:700;white-space:nowrap}.badge{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--panel2);color:var(--muted)}
.badge.new{background:var(--accent);color:var(--accent-text)}
.sugg{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-top:4px;max-height:220px;overflow:auto}.sugg div{padding:10px 12px;border-top:1px solid var(--line)}.sugg div:first-child{border-top:0}
.hidden{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.bar .btn{max-width:640px;margin:0 auto}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));background:#14171c;color:#fff;border-radius:12px;padding:12px 16px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.hint{border-radius:11px;padding:10px 12px;background:var(--panel2);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<header><b>Helfer-Aufmaß</b><small id="hb">–</small></header>
<main id="main"></main>
<div class="bar" id="bar"><div id="st" class="small muted hidden" style="text-align:center;margin:-2px 0 6px"></div><button class="btn primary block" id="send">Abschicken</button><button class="btn block hidden" id="sendZip" style="margin-top:6px;min-height:36px;font-size:14px;border:0;background:none;color:var(--muted)">oder als Datei per WhatsApp schicken</button></div>
<div id="toast"></div>
<script>
/* Eigene, abgeschottete Ansicht für Helfer: eigene Datenbank, kein Zugriff auf das echte Aufmaß.
   Er schreibt auf, was er wo gemacht hat, packt es in eine Zip und schickt sie per WhatsApp. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dmy = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const TAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const numDe = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => String(Math.round(n * 100) / 100).replace('.', ',');
let tt; const toast = (t, ms = 2600) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), ms); };

/* --- Speicher (nur für den Helfer, eigene Datenbank) --- */
const DB = { db: null,
  open() { return new Promise((res, rej) => { const q = indexedDB.open('aufmass-helfer', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => { this.db = q.result; res(); }; q.onerror = () => rej(q.error); }); },
  get(k) { return new Promise(res => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  put(k, v) { return new Promise(res => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } };
const S = { cfg: null, name: '', items: [], hours: {}, edit: null, draft: null, unit: 'm', what: null };
const save = () => Promise.all([DB.put('items', S.items), DB.put('hours', S.hours), DB.put('name', S.name)]);

const BASIS = [['Kabel verlegt', 'm'], ['Leerrohr verlegt', 'm'], ['Kabeltrasse montiert', 'm'], ['Steckdose gesetzt', 'St'], ['Schalter gesetzt', 'St'],
  ['Leuchte montiert', 'St'], ['Dose gesetzt', 'St'], ['Netzwerkdose', 'St'], ['Bohrung / Durchbruch', 'St'], ['Brandschott', 'St'], ['Schlitz gestemmt', 'm'], ['Sonstige Arbeit', 'Std']];

async function readCfg() {
  const m = /[#&]c=([^&]+)/.exec(location.hash); if (!m) return null;
  try {
    let s = m[1]; const z = s[0] === 'z'; s = s.slice(1).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    const bin = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const txt = z ? await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : new TextDecoder().decode(bin);
    const c = JSON.parse(txt); return c && c.v === 1 ? c : null;
  } catch (e) { console.error(e); return null; }
}

function render() {
  const c = S.cfg; $('#hb').textContent = c ? c.b : 'ohne Baustelle';
  if (!S.name) {
    $('#main').innerHTML = `<div class="card"><b style="font-size:18px">Hallo!</b>
      <p class="small muted">Hier schreibst du auf, was du wo gemacht hast. Am Ende tippst du „Abschicken“ und schickst die Datei per WhatsApp. Positionsnummern brauchst du nicht.</p>
      <label class="f">Dein Name</label><input class="i" id="nm" autocomplete="given-name" placeholder="Vorname Nachname">
      <button class="btn primary block" id="nmok" style="margin-top:12px">Los geht's</button>
      ${standalone() ? '' : '<div class="hint">Tipp fürs iPhone: erst unten <b>Teilen → „Zum Home-Bildschirm“</b>, dann die App nur noch über das Symbol öffnen – sonst sind deine Einträge woanders gespeichert.</div>'}</div>`;
    $('#nmok').onclick = async () => { const v = $('#nm').value.trim(); if (!v) return; S.name = v; await save(); render(); };
    $('#bar').classList.add('hidden'); return;
  }
  $('#bar').classList.remove('hidden');
  const e = S.edit || S.draft || { date: todayISO(), what: '', qty: '', unit: S.unit, raum: S.lastRaum || '', bem: '' };
  const fav = (c?.i || []).slice(0, 24);
  $('#main').innerHTML = `
  <div class="card">
    <div class="row"><b class="grow" style="font-size:17px">${S.edit ? 'Eintrag ändern' : 'Neuer Eintrag'}</b><input class="i" id="fd" type="date" value="${esc(e.date)}" style="width:auto;min-height:38px;font-size:15px"></div>
    <label class="f">Was hast du gemacht?</label>
    <input class="i" id="fw" value="${esc(e.what)}" placeholder="z. B. Kabel NYM 3x1,5 gezogen" autocomplete="off">
    ${fav.length ? `<div class="small muted" style="margin:10px 2px 6px">Häufig auf dieser Baustelle:</div><div class="chips">${fav.map((x, i) => `<button class="chip ${e.pos === x.p ? 'on' : ''}" data-fav="${i}">${esc(x.t)}</button>`).join('')}</div>` : ''}
    <div class="small muted" style="margin:10px 2px 6px">Oder allgemein:</div>
    <div class="chips">${BASIS.map((x, i) => `<button class="chip" data-bas="${i}">${esc(x[0])}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><div style="width:38%"><label class="f" style="margin-top:0">Menge</label><input class="i" id="fq" inputmode="decimal" value="${esc(e.qty)}" placeholder="0"></div>
      <div class="grow"><label class="f" style="margin-top:0">Einheit</label><div class="seg" id="fu">${['m', 'St', 'Std'].map(u => `<button data-u="${u}" class="${e.unit === u ? 'on' : ''}">${u === 'St' ? 'Stück' : u === 'Std' ? 'Std' : 'Meter'}</button>`).join('')}</div></div></div>
    <label class="f">Wo? (Raum)</label><input class="i" id="fr" value="${esc(e.raum)}" placeholder="z. B. B104 oder Flur 1.OG" autocomplete="off"><div class="sugg hidden" id="frs"></div>
    <label class="f">Bemerkung <span style="font-weight:400">(optional)</span></label><input class="i" id="fb" value="${esc(e.bem)}">
    <div class="row" style="margin-top:14px">${S.edit ? '<button class="btn" id="fx">Abbrechen</button>' : ''}<button class="btn primary grow" id="fs">${S.edit ? 'Speichern' : '+ Eintragen'}</button></div>
    ${S.edit ? '<button class="btn danger block" id="fdel" style="margin-top:8px">Eintrag löschen</button>' : ''}
  </div>
  <div class="card"><b>Meine Stunden</b>
    <div class="row" style="margin-top:8px"><div class="grow small muted">am ${dmy(e.date)}</div><input class="i" id="hh" inputmode="decimal" style="width:38%" placeholder="Std" value="${esc(S.hours[e.date]?.h || '')}"></div></div>
  ${listHTML()}`;
  S.what = e.pos ? { p: e.pos, t: e.what } : null;
  wire(e);
  const n = S.items.filter(x => !x.sent).length + Object.values(S.hours).filter(x => !x.sent && numDe(x.h)).length;
  const box = !!S.cfg?.m; $('#sendZip').classList.toggle('hidden', !box); $('#st').classList.toggle('hidden', !box);
  if (box) { $('#send').textContent = n ? `Jetzt übertragen (${n})` : '✓ Alles übertragen'; $('#send').classList.toggle('primary', !!n); $('#st').textContent = S.boxMsg || (n ? 'wird automatisch übertragen, sobald Netz da ist' : `${S.cfg?.n || 'Dein Vorarbeiter'} bekommt deine Einträge automatisch`); }
  else $('#send').textContent = n ? `Abschicken (${n} neu)` : 'Alles nochmal schicken';
}
function listHTML() {
  if (!S.items.length) return '<p class="small muted" style="text-align:center;margin:24px 8px">Noch nichts eingetragen.</p>';
  const days = [...new Set(S.items.map(x => x.date))].sort().reverse();
  return days.map(d => `<h3>${TAG[new Date(d + 'T12:00').getDay()]}, ${dmy(d)}${S.hours[d] && numDe(S.hours[d].h) ? ` · ${esc(S.hours[d].h)} Std` : ''}</h3><div class="card" style="padding:4px 14px">
    ${S.items.filter(x => x.date === d).sort((a, b) => b.created - a.created).map(x => `<div class="it" data-id="${x.id}"><div class="grow"><div>${esc(x.what)}</div><div class="small muted">${esc(x.raum || 'ohne Raum')}${x.bem ? ' · ' + esc(x.bem) : ''}</div></div>
      <div style="text-align:right"><div class="q">${x.qty !== '' ? esc(fmt(numDe(x.qty))) + ' ' + esc(x.unit) : ''}</div><span class="badge ${x.sent ? '' : 'new'}">${x.sent ? 'geschickt' : 'neu'}</span></div></div>`).join('')}</div>`).join('');
}
function wire(e) {
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => { const x = S.cfg.i[+b.dataset.fav]; $('#fw').value = x.t; S.what = x; setUnit(x.u);
    document.querySelectorAll('[data-fav]').forEach(y => y.classList.toggle('on', y === b)); $('#fq').focus(); });
  document.querySelectorAll('[data-bas]').forEach(b => b.onclick = () => { const x = BASIS[+b.dataset.bas]; $('#fw').value = x[0]; S.what = null; setUnit(x[1]);
    document.querySelectorAll('[data-fav]').forEach(y => y.classList.remove('on')); $('#fw').focus(); $('#fw').setSelectionRange(99, 99); });
  $('#fw').oninput = () => { if (S.what && $('#fw').value !== S.what.t) { S.what = null; document.querySelectorAll('[data-fav]').forEach(y => y.classList.remove('on')); } };
  document.querySelectorAll('#fu [data-u]').forEach(b => b.onclick = () => setUnit(b.dataset.u));
  rooms($('#fr'), $('#frs'));
  $('#fd').onchange = () => { if (S.edit) S.edit = { ...read(), id: S.edit.id }; else S.draft = read(); render(); };
  $('#hh').onchange = async () => { const d = $('#fd').value || todayISO(); const v = $('#hh').value.trim(); if (v) S.hours[d] = { h: v, sent: false }; else delete S.hours[d]; await save(); render(); toast('Stunden gespeichert'); autoSoon(); };
  $('#fs').onclick = async () => {
    const r = read(); if (!r.what) { toast('Bitte eintragen, was du gemacht hast'); return; }
    if (r.qty === '' && r.unit !== 'Std') { toast('Bitte eine Menge eintragen'); return; }
    if (S.edit?.id) { const o = S.items.find(x => x.id === S.edit.id); Object.assign(o, r, { sent: false, updated: Date.now() }); }
    else S.items.push({ id: uid(), ...r, created: Date.now(), updated: Date.now(), sent: false });
    S.unit = r.unit; S.lastRaum = r.raum; S.edit = null; S.draft = { date: r.date, what: '', qty: '', unit: r.unit, raum: r.raum, bem: '' }; S.what = null; await save(); render(); toast('Gespeichert ✓'); autoSoon();
  };
  if ($('#fx')) $('#fx').onclick = () => { S.edit = null; render(); };
  if ($('#fdel')) $('#fdel').onclick = async () => { if (!confirm(S.items.find(x => x.id === S.edit.id)?.sent && S.cfg?.m ? `Der Eintrag ist schon übertragen. Hier löschen? (Sag ${S.cfg?.n || 'deinem Vorarbeiter'} Bescheid, falls er ihn schon übernommen hat.)` : 'Eintrag löschen?')) return; S.items = S.items.filter(x => x.id !== S.edit.id); S.edit = null; await save(); render(); };
  document.querySelectorAll('.it').forEach(el => el.onclick = () => { const x = S.items.find(y => y.id === el.dataset.id); S.edit = { ...x }; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}
function setUnit(u) { S.unit = u; document.querySelectorAll('#fu [data-u]').forEach(b => b.classList.toggle('on', b.dataset.u === u)); }
function read() {
  const unit = document.querySelector('#fu .on')?.dataset.u || 'm';
  return { date: $('#fd').value || todayISO(), what: $('#fw').value.trim(), qty: $('#fq').value.trim(), unit, raum: $('#fr').value.trim(), bem: $('#fb').value.trim(), pos: S.what?.p || '' };
}
function rooms(inp, box) {
  const list = S.cfg?.r || []; const n = s => s.toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
  const show = () => { const q = n(inp.value); if (!q || !list.length) { box.classList.add('hidden'); return; }
    const hits = list.filter(r => n(r).includes(q)).sort((a, b) => (n(a).startsWith(q) ? 0 : 1) - (n(b).startsWith(q) ? 0 : 1) || a.length - b.length).slice(0, 8);
    if (!hits.length || (hits.length === 1 && hits[0] === inp.value)) { box.classList.add('hidden'); return; }
    box.innerHTML = hits.map(h => `<div>${esc(h)}</div>`).join(''); box.classList.remove('hidden');
    box.querySelectorAll('div').forEach(d => d.onclick = () => { inp.value = d.textContent; box.classList.add('hidden'); }); };
  inp.oninput = show; inp.onblur = () => setTimeout(() => box.classList.add('hidden'), 200);
}
const standalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;

function pack(items, hours) {
  return { type: 'aufmass-helfer', v: 1, helfer: S.name, pid: S.cfg?.pid || '', baustelle: S.cfg?.b || '', created: new Date().toISOString(),
    items: items.map(({ sent, ...x }) => x), hours };
}
/* --- Automatisch: in den Briefkasten (Google-Skript des Chefs) --- */
let sending = false, again = false, timer = null;
const autoSoon = (ms = 1200) => { clearTimeout(timer); timer = setTimeout(autoSend, ms); };
async function autoSend(manual) {
  const m = S.cfg?.m; if (!m || !S.name) return;
  if (sending) { again = true; return; }
  const items = S.items.filter(x => !x.sent); const hrs = Object.entries(S.hours).filter(([, v]) => !v.sent && numDe(v.h));
  if (!items.length && !hrs.length) { if (manual) toast('Alles ist schon übertragen ✓'); return; }
  if (!navigator.onLine) { S.boxMsg = 'kein Netz – wird nachgeholt'; render(); return; }
  sending = true; const snap = new Map(items.map(x => [x.id, x.updated])); const hsnap = hrs.map(([d, v]) => [d, v.h]);
  try {
    const r = await fetch(m.u, { method: 'POST', body: JSON.stringify({ k: m.t, d: pack(items, hrs.map(([date, v]) => ({ date, h: v.h }))) }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Fehler');
    for (const x of S.items) if (snap.has(x.id) && snap.get(x.id) === x.updated) x.sent = true;
    for (const [d, h] of hsnap) if (S.hours[d] && S.hours[d].h === h) S.hours[d].sent = true;
    S.boxMsg = 'übertragen um ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' ✓'; await save(); if (manual) toast('Übertragen ✓');
  } catch (e) { console.error(e); S.boxMsg = 'Übertragung klappt gerade nicht – wird nachgeholt'; if (manual) toast('Hat nicht geklappt: ' + (e.message || e)); }
  sending = false; if (!S.edit) render(); else { const n = S.items.filter(x => !x.sent).length; $('#st').textContent = S.boxMsg; }
  if (again) { again = false; autoSoon(); }
}
window.addEventListener('online', () => autoSoon(300));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSoon(300); });
setInterval(() => autoSend(), 120000);

/* --- Abschicken: alles in eine Zip, über WhatsApp teilen --- */
$('#send').onclick = () => S.cfg?.m ? autoSend(true) : sendZip();
$('#sendZip').onclick = () => sendZip();
async function sendZip() {
  const neu = S.items.filter(x => !x.sent); const hn = Object.entries(S.hours).filter(([, v]) => !v.sent && numDe(v.h));
  const all = !neu.length && !hn.length;
  if (all && !S.items.length && !Object.keys(S.hours).length) { toast('Noch nichts eingetragen'); return; }
  if (all && !confirm('Alles ist schon geschickt. Trotzdem alles nochmal schicken?')) return;
  const items = all ? S.items : neu; const hours = (all ? Object.entries(S.hours) : hn).map(([date, v]) => ({ date, h: v.h }));
  const data = pack(items, hours);
  const zip = new JSZip(); zip.file('helfer.json', JSON.stringify(data, null, 1));
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/zip' });
  const name = `Helfer_${S.name.replace(/[^A-Za-z0-9äöüÄÖÜß]+/g, '_')}_${todayISO()}.zip`;
  const file = new File([blob], name, { type: 'application/zip' });
  let ok = false;
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); ok = true; } } catch (e) { if (e.name === 'AbortError') return; }
  if (!ok) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    ok = confirm('Datei wurde gespeichert. Hast du sie verschickt? (Dann wird alles als „geschickt“ markiert)'); }
  if (ok) { for (const x of items) x.sent = true; for (const h of hours) if (S.hours[h.date]) S.hours[h.date].sent = true; await save(); render(); toast('Als geschickt markiert ✓'); }
}

(async () => {
  await DB.open();
  const c = await readCfg(); S.cfg = c || await DB.get('cfg') || null; if (c) await DB.put('cfg', c);
  S.name = (await DB.get('name')) || ''; S.items = (await DB.get('items')) || []; S.hours = (await DB.get('hours')) || {};
  render(); autoSoon(500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
